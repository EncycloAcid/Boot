name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build (core, CLI and the SwiftUI app)
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle Boot.app
        run: scripts/make-app.sh

  linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Autopilot balance run
        run: swift run boot-cli balance 8

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Robolectric's Android 15+ images need JDK 21.
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Simulation tests
        run: ./gradlew :core:test
      - name: UI tests, lint and APKs
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: Autopilot balance run
        run: ./gradlew :core:balance -Pruns=8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/screenshots/

  windows-desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build portable Windows game
        run: ./gradlew.bat :desktop:createDistributable
      - name: Package portable ZIP
        shell: pwsh
        run: |
          $appDir = "desktop/build/compose/binaries/main/app/Boot Game Tycoon"
          $distDir = "desktop/build/distributions"
          @"
          Boot Game Tycoon (Windows portable)

          1. Extract the entire ZIP to a folder.
          2. Open `"Boot Game Tycoon.exe`" from the extracted folder.

          The game includes its runtime and does not need an installer.
          "@ | Set-Content -LiteralPath "$appDir/README.txt" -Encoding utf8
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          Compress-Archive -Path "$appDir/*" -DestinationPath "$distDir/Boot-Game-Tycoon-Windows-Portable.zip" -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: boot-windows-portable
          path: android/desktop/build/distributions/Boot-Game-Tycoon-Windows-Portable.zip
