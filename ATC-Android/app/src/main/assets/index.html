<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CLE ATC</title>
<style>
:root{--bg:#06100b;--panel:#101d16;--line:#2a4b36;--green:#a7ffbb;--dim:#75ad83;--amber:#ffd071;--red:#ff6969}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--green);font:12px monospace;overflow:hidden}header,footer{display:flex;justify-content:space-between;padding:8px 12px;background:#0b1710;border-bottom:1px solid var(--line);height:35px}footer{height:23px;border-top:1px solid var(--line);border-bottom:0;font-size:9px;color:var(--dim)}main{height:calc(100dvh - 58px);padding:6px;display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:6px}#scope{position:relative;border:1px solid var(--line);min-height:0}canvas{width:100%;height:100%;display:block;touch-action:manipulation}#tag{position:absolute;right:8px;top:8px;color:var(--amber);pointer-events:none}#hint{position:absolute;left:8px;top:8px;color:var(--dim);font-size:10px;pointer-events:none}aside{display:flex;flex-direction:column;gap:5px;min-height:0}.panel{background:var(--panel);border:1px solid var(--line);padding:7px;border-radius:4px}h3{font-size:10px;margin:0 0 6px;color:#e4ffea;letter-spacing:1px}.tabs,.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}button,input,select{background:#09150e;color:var(--green);border:1px solid #3a6548;border-radius:3px;padding:6px;font:11px monospace;min-width:0}button{cursor:pointer}button.active{background:#285337;border-color:#a7ffbb}.fields{display:grid;grid-template-columns:1fr 1fr;gap:5px}.fields label{display:flex;flex-direction:column;gap:3px;color:var(--dim);font-size:9px}.fields input,.fields select{width:100%}.actions{grid-template-columns:1fr 1fr;margin-top:6px}.wide{width:100%;margin-top:5px}#traffic{overflow:auto;flex:1;min-height:50px}.flight{display:flex;justify-content:space-between;border-bottom:1px solid #213b2a;padding:4px 0;gap:3px}.flight button{padding:3px 5px}.log{height:75px;overflow:auto;font-size:9px;line-height:1.4;color:#9bd7a8}.log div{border-bottom:1px solid #1d3425;padding:2px 0}@media(max-width:650px){main{grid-template-columns:minmax(0,1fr) 215px}.panel{padding:5px}button,input,select{padding:4px}}
</style></head><body>
<header><b>◉ CLE ATC SIMULATOR</b><span id="clock">SIM 00:00</span></header>
<main><section id="scope"><canvas id="radar"></canvas><div id="hint">RADAR · SELECT TARGET · ISSUE INSTRUCTIONS</div><div id="tag">NO TARGET SELECTED</div></section>
<aside>
<section class="panel"><h3>CONTROL POSITION</h3><div class="tabs"><button class="active" data-mode="RADAR">RADAR</button><button data-mode="TOWER">TOWER</button><button data-mode="GROUND">GROUND</button></div><div class="actions"><button id="pause">Ⅱ PAUSE</button><button id="new">＋ TRAFFIC</button></div></section>
<section class="panel"><h3 id="selTitle">AIRCRAFT CONTROL</h3><div id="info" style="color:var(--dim);margin-bottom:6px;line-height:1.5">Select an aircraft target.</div><div class="fields"><label>HEADING °<input id="hdg" type="number" min="0" max="359" value="090"></label><label>ALTITUDE FT<select id="alt"><option>3000</option><option>5000</option><option>7000</option><option>9000</option><option>11000</option></select></label><label>SPEED KT<input id="spd" type="number" min="100" max="280" value="180"></label><label>RUNWAY<select id="rwy"><option>24L</option><option>24R</option><option>06L</option><option>06R</option></select></label></div><div class="actions"><button id="vector">↗ HEADING</button><button id="climb">⇅ ALTITUDE</button><button id="speed">◈ SPEED</button><button id="approach">▰ APPROACH</button></div><button id="clear" class="wide">✈ TAKEOFF / LANDING CLEARANCE</button><button id="handoff" class="wide">⇢ HANDOFF / TAXI</button></section>
<section class="panel" style="flex:1;min-height:0;display:flex;flex-direction:column"><h3>ACTIVE TRAFFIC <span id="count"></span></h3><div id="traffic"></div></section>
<section class="panel"><h3>RADIO / EVENT LOG</h3><div class="log" id="log"></div></section>
</aside></main><footer><span>SIMULATED TRAINING GAME · NOT FOR REAL-WORLD ATC</span><span id="status">TRAFFIC NORMAL</span></footer>
<script>
(()=>{const $=id=>document.getElementById(id),cv=$('radar'),c=cv.getContext('2d');let planes=[],sel=null,mode='RADAR',paused=false,sim=0,last=performance.now(),spawn=0,n=21,seq=0;const calls=['UAL','SWA','DAL','AAL','JBU','FFT','SKW','ENY','ASA'];
function log(s){let e=document.createElement('div');e.textContent=String(Math.floor(sim/60)).padStart(2,'0')+':'+String(Math.floor(sim%60)).padStart(2,'0')+' '+s;$('log').prepend(e);while($('log').children.length>30)$('log').lastChild.remove()}
function radio(s){log('PILOT: '+s);if(window.speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.rate=1;u.pitch=.82;speechSynthesis.speak(u)}}
function spawnPlane(){let edge=Math.floor(Math.random()*4),x=edge===1?.94:edge===3?.06:.08+Math.random()*.84,y=edge===0?.08:edge===2?.92:.1+Math.random()*.8,in=Math.random()<.65,a={id:calls[Math.floor(Math.random()*calls.length)]+(n++),x,y,hdg:(Math.atan2(.66-y,.22-x)*180/Math.PI+360)%360,alt:in?9000:3000,speed:in?220:150,tH:null,tA:null,tS:null,phase:in?'ARRIVAL':'DEPARTURE',rwy:'24L',age:0,cleared:false,alert:false};if(!in)a.hdg=225+Math.random()*30;planes.push(a);log(a.id+' checking in, '+a.alt+' feet.');choose(sel||a)}
function choose(a){sel=a;$('tag').textContent=a?a.id+' · '+a.phase:'NO TARGET SELECTED';$('info').textContent=a?a.phase+' · '+Math.round(a.speed)+' KT · '+Math.round(a.alt)+' FT':'Select an aircraft target.';if(a){$('hdg').value=Math.round(a.hdg)%360;$('alt').value=String(a.tA||([3000,5000,7000,9000,11000].reduce((p,v)=>Math.abs(v-a.alt)<Math.abs(p-a.alt)?v:p)));$('spd').value=a.tS||Math.round(a.speed);$('rwy').value=a.rwy}list()}
function list(){$('traffic').innerHTML='';planes.forEach(a=>{let d=document.createElement('div');d.className='flight';let b=document.createElement('button');b.textContent=(a===sel?'▶ ':'')+a.id;b.onclick=()=>choose(a);let s=document.createElement('span');s.textContent=Math.round(a.alt)+'ft';d.append(b,s);$('traffic').append(d)});$('count').textContent='('+planes.length+')'}
function commandH(){if(sel){sel.tH=((+ $('hdg').value%360)+360)%360;radio(sel.id+', turn heading '+String(sel.tH).padStart(3,'0')+'.')}}
function commandA(){if(sel){sel.tA=+$('alt').value;radio(sel.id+', climb and maintain '+sel.tA+' feet.')}}
function update(dt){if(paused)return;sim+=dt;spawn+=dt;if(spawn>28&&planes.length<13){spawn=0;spawnPlane()}for(let a of planes){a.age+=dt;if(a.tH!==null){let d=((a.tH-a.hdg+540)%360)-180;a.hdg=(a.hdg+Math.sign(d)*Math.min(Math.abs(d),dt*18)+360)%360;if(Math.abs(d)<2)a.tH=null}if(a.tA!==null){let d=a.tA-a.alt;a.alt+=Math.sign(d)*Math.min(Math.abs(d),dt*900);if(Math.abs(d)<20)a.tA=null}if(a.tS!==null){let d=a.tS-a.speed;a.speed+=Math.sign(d)*Math.min(Math.abs(d),dt*8);if(Math.abs(d)<2)a.tS=null}let r=a.hdg*Math.PI/180,k=a.speed/3600*dt*.43;a.x+=Math.sin(r)*k;a.y-=Math.cos(r)*k;if(a.x<.03||a.x>.97||a.y<.04||a.y>.96){a.x=Math.max(.03,Math.min(.97,a.x));a.y=Math.max(.04,Math.min(.96,a.y));if(a.age>30)a.hdg=(a.hdg+180)%360}}
let conflict=false;for(let i=0;i<planes.length;i++)for(let j=i+1;j<planes.length;j++){let a=planes[i],b=planes[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<.055&&Math.abs(a.alt-b.alt)<1000){conflict=true;if(!a.alert){log('⚠ CONFLICT RISK '+a.id+' / '+b.id);a.alert=true}}else if(d>.08)a.alert=false}$('status').textContent=conflict?'⚠ SEPARATION RISK':'TRAFFIC NORMAL'}
function draw(){let w=cv.clientWidth,h=cv.clientHeight,dpr=devicePixelRatio||1;if(cv.width!==w*dpr||cv.height!==h*dpr){cv.width=w*dpr;cv.height=h*dpr}c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);c.fillStyle='#06100b';c.fillRect(0,0,w,h);let cx=w/2,cy=h/2,r=Math.min(w,h)*.47;c.strokeStyle='#1c422b';for(let i=1;i<=5;i++){c.beginPath();c.arc(cx,cy,r*i/5,0,Math.PI*2);c.stroke()}c.setLineDash([3,6]);c.beginPath();c.moveTo(cx,cy-r);c.lineTo(cx,cy+r);c.moveTo(cx-r,cy);c.lineTo(cx+r,cy);c.stroke();c.setLineDash([]);c.save();c.translate(w*.22,h*.66);c.rotate(-.12);c.fillStyle='#293a2e';c.fillRect(-w*.19,-6,w*.38,12);c.fillStyle='#c6d9c3';c.fillRect(-w*.18,-.6,w*.36,1.2);c.fillStyle='#26372b';c.fillRect(-w*.16,12,w*.32,4);c.restore();c.fillStyle='#5d9c70';c.font='10px monospace';c.fillText('CLEVELAND HOPKINS · CLE',8,h-12);planes.forEach(a=>{let x=a.x*w,y=a.y*h,t=a.hdg*Math.PI/180;c.strokeStyle=c.fillStyle=a===sel?'#ffd071':'#a7ffbb';c.beginPath();c.moveTo(x+Math.sin(t)*9,y-Math.cos(t)*9);c.lineTo(x+Math.sin(t+2.5)*5,y-Math.cos(t+2.5)*5);c.lineTo(x+Math.sin(t-2.5)*5,y-Math.cos(t-2.5)*5);c.closePath();c.fill();c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.sin(t)*20,y-Math.cos(t)*20);c.stroke();c.font='11px monospace';c.fillText(a.id,x+8,y-7);c.font='9px monospace';c.fillText(String(Math.round(a.alt/100)),x+8,y+4);if(a===sel){c.beginPath();c.arc(x,y,14,0,Math.PI*2);c.stroke()}})}
cv.addEventListener('pointerdown',e=>{let r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height,a=planes.slice().sort((p,q)=>Math.hypot(p.x-x,p.y-y)-Math.hypot(q.x-x,q.y-y))[0];if(a&&Math.hypot(a.x-x,a.y-y)<.1)choose(a)});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(q=>q.classList.toggle('active',q===b));$('hint').textContent=mode+' MODE · CLE SECTOR';log('Control position: '+mode+'.')});
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE'};$('new').onclick=spawnPlane;$('vector').onclick=commandH;$('climb').onclick=commandA;$('speed').onclick=()=>{if(sel){sel.tS=Math.max(100,Math.min(280,+$('spd').value));radio(sel.id+', speed '+sel.tS+' knots.')}};$('approach').onclick=()=>{if(sel){sel.tA=3000;sel.tS=160;sel.rwy=$('rwy').value;sel.cleared=true;radio(sel.id+', cleared for approach runway '+sel.rwy+'.')}};$('clear').onclick=()=>{if(sel){sel.cleared=true;if(sel.phase==='ARRIVAL'){sel.phase='LANDING';sel.tH=245;sel.tA=0;sel.tS=115;radio(sel.id+', cleared to land runway '+sel.rwy+'.')}else{sel.phase='DEPARTURE';sel.tA=5000;sel.tS=210;sel.tH=245;radio(sel.id+', cleared for takeoff runway '+sel.rwy+'.')}choose(sel)}};$('handoff').onclick=()=>{if(sel){radio(mode==='GROUND'?sel.id+', taxi to runway '+sel.rwy+', hold short.':sel.id+', contact next control position.');sel.cleared=true}};let frames=0;function loop(now){let dt=Math.min(.12,(now-last)/1000);last=now;update(dt);draw();if(++frames%20===0){list();$('clock').textContent='SIM '+String(Math.floor(sim/60)).padStart(2,'0')+':'+String(Math.floor(sim%60)).padStart(2,'0')}requestAnimationFrame(loop)}for(let i=0;i<6;i++)spawnPlane();log('CLE approach control online. Simulated traffic only.');requestAnimationFrame(loop)})();
</script></body></html>
